# The website's static files only. TLS, compression, security headers, and the /v1/site and
# /downloads/ proxies belong to the edge proxy in front (vhosts/30-adventwave-site-https.conf.template).
server_tokens off;

# Hashed file names: safe to keep for a year. index.html must never be cached, or a browser
# keeps asking for assets the last release deleted.
map $uri $aw_cache {
    ~^/assets/  "public, max-age=31536000, immutable";
    default     "no-cache";
}

server {
    listen 80;
    root /usr/share/nginx/site;
    add_header Cache-Control $aw_cache always;
    # /download and any other route is the single-page app's.
    location / { try_files $uri /index.html; }
}
