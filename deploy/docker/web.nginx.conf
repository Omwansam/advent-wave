# Static files only. TLS, compression, security headers and the /v1 proxy belong to the edge
# proxy in front (vhosts/20-adventwave-https.conf.template).
server_tokens off;

# Hashed file names: safe to keep for a year. index.html must never be cached, or a browser
# keeps asking for assets the last release deleted.
map $uri $aw_cache {
    ~^/assets/  "public, max-age=31536000, immutable";
    default     "no-cache";
}

server {
    listen 80;
    root /usr/share/nginx/web;
    add_header Cache-Control $aw_cache always;
    location / { try_files $uri /index.html; }

    # The desktop app's installers and update feeds (DESKTOP/, deploy/docker/desktop-sync.py).
    # Their names never change between releases, so nothing here is cached for long: the feeds
    # and release.json not at all, the installers for five minutes.
    location /downloads/ {
        root /usr/share/nginx;
        autoindex off;
        location ~ \.(yml|json)$ {
            add_header Cache-Control "no-cache" always;
        }
        location ~ /\. { return 404; }
        add_header Cache-Control "public, max-age=300" always;
        add_header Content-Disposition "attachment" always;
        types {
            application/x-msdownload exe;
            application/x-apple-diskimage dmg;
            application/vnd.debian.binary-package deb;
            application/zip zip;
            text/yaml yml;
            application/json json;
        }
        default_type application/octet-stream;
    }
}

server {
    listen 81;
    root /usr/share/nginx/admin;
    add_header Cache-Control $aw_cache always;
    location / { try_files $uri /index.html; }
}
