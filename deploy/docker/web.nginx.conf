# Static files only. TLS, compression, security headers and the /v1 proxy belong to the edge
# proxy in front (vhosts/20-adventwave-https.conf.template).
server_tokens off;

# Hashed file names: safe to keep for a year. index.html must never be cached, or a browser
# keeps asking for assets the last release deleted.
map $uri $aw_cache {
    ~^/assets/  "public, max-age=31536000, immutable";
    default     "no-cache";
}

server {
    listen 80;
    root /usr/share/nginx/web;
    add_header Cache-Control $aw_cache always;
    location / { try_files $uri /index.html; }
}

server {
    listen 81;
    root /usr/share/nginx/admin;
    add_header Cache-Control $aw_cache always;
    location / { try_files $uri /index.html; }
}
