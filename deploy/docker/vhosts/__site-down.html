<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="60">
<title>Temporarily unavailable</title>
<style>
  :root { color-scheme: light dark; --bg: #f6f7f9; --card: #fff; --text: #1d2330; --muted: #5b6475; }
  @media (prefers-color-scheme: dark) { :root { --bg: #12151b; --card: #1b2029; --text: #e8ebf1; --muted: #9aa3b5; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 16px; box-sizing: border-box; }
  main { max-width: 32rem; background: var(--card); border-radius: 16px; padding: 32px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  h1 { font-size: 1.4rem; margin: 0 0 8px; }
  p { margin: 0 0 12px; color: var(--muted); }
  .host { color: var(--text); font-weight: 600; word-break: break-all; }
</style>
</head>
<body>
<main>
  <h1>This website is temporarily unavailable</h1>
  <p><span class="host" id="host">This site</span> is down for the moment. Nothing is wrong with your connection.</p>
  <p>Please try again in a few minutes. This page checks again by itself every minute.</p>
</main>
<script>document.getElementById("host").textContent = location.hostname;</script>
</body>
</html>
