spring:
  application:
    name: adventwave-gateway

  datasource:
    # Port 5434 matches docker-compose.yml, chosen to avoid locally installed Postgres instances.
    url: ${ADVENTWAVE_DB_URL:jdbc:postgresql://localhost:5434/adventwave}
    username: ${ADVENTWAVE_DB_USER:adventwave}
    password: ${ADVENTWAVE_DB_PASSWORD:adventwave}
    hikari:
      # The home page fans out ~5 concurrent queries per request on virtual threads. Virtual
      # threads are cheap; connections are not, so the pool is the real concurrency limit and is
      # sized deliberately rather than left at the default.
      maximum-pool-size: 20
      minimum-idle: 5

  jpa:
    open-in-view: false          # a lazy load in a serialiser is a bug, not a convenience
    hibernate:
      ddl-auto: validate         # Flyway owns the schema; Hibernate only checks it agrees
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  data:
    redis:
      host: ${ADVENTWAVE_REDIS_HOST:localhost}
      port: ${ADVENTWAVE_REDIS_PORT:6379}
      timeout: 2s

  threads:
    virtual:
      enabled: true

  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  error:
    include-message: never       # error bodies come from ApiExceptionHandler, uniformly

adventwave:
  cors:
    # The Vite dev servers: the listener app (5173) and the admin app (5174). The admin app's API
    # calls go through its proxy, but the browser PUTs a master straight to the upload URL,
    # cross-origin, exactly as it would to S3. Production origins are supplied by configuration,
    # never hardcoded.
    allowed-origins: ${ADVENTWAVE_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174}

  security:
    # Off everywhere but local development: the gateway refuses to start while the dev token
    # issuer is on or any secret below is still its published "dev-only" default
    # (DevDefaultsGuard). Set true only for a throwaway environment.
    allow-dev-defaults: ${ADVENTWAVE_ALLOW_DEV_DEFAULTS:false}

  auth:
    # Local token issuance, for use only until the managed IdP is chosen. Setting
    # spring.security.oauth2.resourceserver.jwt.issuer-uri disables both this endpoint and the
    # dev decoder.
    dev-issuer: ${ADVENTWAVE_DEV_ISSUER:true}
    dev-secret: ${ADVENTWAVE_DEV_SECRET:dev-only-secret-at-least-32-bytes-long-change-me}
    # Emails the dev issuer grants the pre-RBAC catalog:write scope. Empty by default since
    # RFC 0001: the admin portal signs in with a password at POST /v1/auth/admin/login, and an
    # email-only issuer handing out admin rights would bypass it. Set it only for old tooling, on
    # a machine nobody else can reach. Goes away with the dev issuer.
    admin-emails: ${ADVENTWAVE_ADMIN_EMAILS:}
    # Admin-portal accounts (RFC 0001): email + password sign-in, roles, session revocation.
    admin:
      # HMAC key for admin tokens, distinct from dev-secret. Set it everywhere but a laptop.
      token-secret: ${ADVENTWAVE_ADMIN_TOKEN_SECRET:dev-only-admin-token-secret-at-least-32-bytes-change-me}
      token-ttl: 8h
      max-failed-logins: 5
      lockout: 15m
      min-password-length: 12
      # The first super admin, created at startup only while no admin account exists.
      bootstrap-email: ${ADVENTWAVE_ADMIN_BOOTSTRAP_EMAIL:}
      bootstrap-password: ${ADVENTWAVE_ADMIN_BOOTSTRAP_PASSWORD:}
      bootstrap-name: ${ADVENTWAVE_ADMIN_BOOTSTRAP_NAME:Administrator}

  catalog:
    api-base-url: ${ADVENTWAVE_API_BASE_URL:http://localhost:8080}
    signed-url-ttl: 5m
    target-lufs: -14.0
    signing-secret: ${ADVENTWAVE_SIGNING_SECRET:dev-only-playback-signing-secret-change-me}
    # The derived bucket's CDN origin; a storage key is appended to it. Empty means
    # {api-base-url}/media-storage, which only the local profile's media origin answers.
    media-origin-url: ${ADVENTWAVE_MEDIA_ORIGIN_URL:}

  audio:
    # Master uploads and the local transcode worker (RFC 0001, contracts/audio/transcode.md).
    # The worker runs in this process only where application-local.yml turns it on; elsewhere it
    # is workstream D's service and this gateway only produces `requested`.
    local-worker-enabled: false
    # Relative to the working directory, which is backend/gateway under spring-boot:run.
    transcode-script: ${ADVENTWAVE_TRANSCODE_SCRIPT:../tools/transcode.py}
    transcode-timeout: 60m
    # attempt 2 after 30 s, attempt 3 after 2 min, then a `failed` message
    retry-backoff: 30s,2m
    max-upload-bytes: 4GB
    upload-url-ttl: 10m
    upload-signing-secret: ${ADVENTWAVE_UPLOAD_SIGNING_SECRET:dev-only-upload-signing-secret-change-me}

  player:
    flush-interval-ms: 30000     # the documented bound on player-position loss

  events:
    playback-per-minute: 240     # ~1 progress event every 250ms per listener before limiting
    dispatcher:
      # INTERIM: delivers outbox rows to the in-process handlers (events-pipeline module).
      # Set false once Debezium publishes the outbox to Kafka; the handlers then consume
      # from there. See contracts/kafka/README.md.
      enabled: ${ADVENTWAVE_EVENTS_DISPATCHER:true}
      interval-ms: 2000
      batch-size: 500

  contracts:
    # The contract version this build implements — <repo>/contracts/VERSION. CI asserts the
    # generated OpenAPI carries the same value.
    version: 1.3.0

springdoc:
  # The document is generated from the controllers and dumped to contracts/openapi/ by
  # tools/dump-openapi.sh. Sorting keeps that file's diff meaningful between regenerations.
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
  writer-with-order-by-keys: true
  default-produces-media-type: application/json

logging:
  level:
    org.adventwave: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
