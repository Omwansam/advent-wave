# Local development profile. Activate with:
#
#   ./mvnw spring-boot:run -pl gateway -Dspring-boot.run.profiles=local
#
# or by exporting SPRING_PROFILES_ACTIVE=local. Spring merges this on top of
# application.yml, so only the values that differ from the defaults belong here.
spring:
  datasource:
    # application.yml defaults to 5434, which is the port docker-compose publishes.
    # A natively installed Debian cluster (16/main) usually listens on 5433 instead;
    # check yours with `pg_lsclusters`.
    url: jdbc:postgresql://localhost:5433/adventwave

logging:
  level:
    # The three classes that touch Redis. With no Redis running each one logs a full
    # RedisConnectionException stack trace every time it is called — PlayerStateService on
    # every 30-second flush tick and every player-state write, HomeSectionCache three times
    # per GET /v1/home, RateLimiter per playback event. Every one of those paths already
    # catches the failure and falls through to Postgres, so the traces document an expected,
    # handled condition and bury everything else in the log.
    #
    # Install Redis (sudo apt install redis-server) and these lines stop mattering: the
    # warnings they hide can only fire when Redis is absent.
    org.adventwave.platform.player.PlayerStateService: ERROR
    org.adventwave.gateway.assemble.HomeSectionCache: ERROR
    org.adventwave.gateway.events.RateLimiter: ERROR

adventwave:
  catalog:
    # Nothing serves derived assets until the CDN origin exists (drift A1 in
    # contracts/audio/transcode.md), so locally the gateway serves {root}/derived/ itself.
    # tools/transcode.py writes to the same directory; both read ADVENTWAVE_MEDIA_ROOT.
    local-media-root: ${ADVENTWAVE_MEDIA_ROOT:${user.home}/media}

  audio:
    # Transcode `requested` jobs in this process with tools/transcode.py (LocalTranscodeWorker),
    # writing to the local media root above. Startup fails if the script, python3, ffmpeg or
    # ffprobe is missing. Set ADVENTWAVE_LOCAL_WORKER=false to leave items in processing instead.
    local-worker-enabled: ${ADVENTWAVE_LOCAL_WORKER:true}

management:
  health:
    redis:
      # Redis is a cache and a write buffer here, never a source of truth: every call site
      # catches its own failure and falls through to Postgres. Running without it is a
      # supported local setup, so its absence must not make /actuator/health return 503 —
      # a DOWN aggregate reads as "the backend is broken" when nothing is.
      enabled: false
