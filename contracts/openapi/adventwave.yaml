components:
  schemas:
    AdminAlbumDto:
      type: object
      properties:
        artistId:
          type: string
        coverUrl:
          type: string
        createdAt:
          type: string
        id:
          type: string
        releaseDate:
          type: string
        title:
          type: string
    AdminArtistDto:
      type: object
      properties:
        bio:
          type: string
        churchId:
          type: string
        coverUrl:
          type: string
        createdAt:
          type: string
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        verified:
          type: boolean
    AdminMediaItemDto:
      type: object
      properties:
        albumId:
          type: string
        artistId:
          type: string
        assets:
          type: array
          items:
            $ref: "#/components/schemas/Asset"
        coverUrl:
          type: string
        createdAt:
          type: string
        durationMs:
          type: integer
          format: int32
        genre:
          type: string
        id:
          type: string
        language:
          type: string
        licenseId:
          type: string
        loudnessLufs:
          type: number
          format: double
        masterStorageKey:
          type: string
        mediaType:
          type: string
        popularity:
          type: integer
          format: int32
        publishedAt:
          type: string
        region:
          type: string
        status:
          type: string
        title:
          type: string
        truePeakDbfs:
          type: number
          format: double
        updatedAt:
          type: string
    AlbumDto:
      type: object
      properties:
        artist:
          type: string
        artistId:
          type: string
        cover:
          type: string
        id:
          type: string
        songIds:
          type: array
          items:
            type: string
        title:
          type: string
        tracks:
          type: array
          items:
            $ref: "#/components/schemas/TrackDto"
    ArtistDto:
      type: object
      properties:
        cover:
          type: string
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        songIds:
          type: array
          items:
            type: string
        tracks:
          type: array
          items:
            $ref: "#/components/schemas/TrackDto"
        verified:
          type: boolean
    Asset:
      type: object
      properties:
        bitrateKbps:
          type: integer
          format: int32
        byteSize:
          type: integer
          format: int64
        channels:
          type: integer
          format: int32
        checksumSha256:
          type: string
        codec:
          type: string
        container:
          type: string
        profile:
          type: string
        sampleRateHz:
          type: integer
          format: int32
        storageKey:
          type: string
    BecauseYouListened:
      type: object
      properties:
        artistName:
          type: string
        songs:
          type: array
          items:
            $ref: "#/components/schemas/TrackDto"
    BrowseDto:
      type: object
      properties:
        categories:
          type: array
          items:
            $ref: "#/components/schemas/DiscoverCategoryDto"
        podcasts:
          type: array
          items:
            $ref: "#/components/schemas/TrackDto"
        sermons:
          type: array
          items:
            $ref: "#/components/schemas/TrackDto"
        songs:
          type: array
          items:
            $ref: "#/components/schemas/TrackDto"
    ChurchDto:
      type: object
      properties:
        consentStatus:
          type: string
        contactEmail:
          type: string
        country:
          type: string
        createdAt:
          type: string
        id:
          type: string
        name:
          type: string
        region:
          type: string
    ConsentRequest:
      type: object
      properties:
        consentStatus:
          type: string
          minLength: 1
          pattern: none|pending|granted|revoked
      required:
      - consentStatus
    CreateRequest:
      type: object
      properties:
        cover:
          type: string
        description:
          type: string
        title:
          type: string
    DiscoverCategoryDto:
      type: object
      properties:
        cover:
          type: string
        gradient:
          type: string
        id:
          type: string
        label:
          type: string
        sortOrder:
          type: integer
          format: int32
    DiscoverDto:
      type: object
      properties:
        categories:
          type: array
          items:
            $ref: "#/components/schemas/DiscoverCategoryDto"
        tracks:
          type: array
          items:
            $ref: "#/components/schemas/TrackDto"
    Error:
      type: object
      description: Body of every error the API produces (ApiExceptionHandler).
      properties:
        error:
          type: string
          description: HTTP reason phrase
        message:
          type: string
          description: "What went wrong, in one sentence"
        status:
          type: integer
          format: int32
          description: "HTTP status code, repeated"
        timestamp:
          type: string
          format: date-time
      required:
      - status
      - error
      - message
      - timestamp
    FollowResultDto:
      type: object
      properties:
        following:
          type: boolean
    HistoryDto:
      type: object
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/HistoryEntry"
        tracks:
          type: array
          items:
            $ref: "#/components/schemas/TrackDto"
    HistoryEntry:
      type: object
      properties:
        id:
          type: string
        ts:
          type: integer
          format: int64
    HomeDto:
      type: object
      properties:
        greetingPeriod:
          type: string
        recentlyPlayed:
          type: array
          items:
            $ref: "#/components/schemas/TrackDto"
        recommendations:
          $ref: "#/components/schemas/RecommendationsDto"
        sabbathWorship:
          type: array
          items:
            $ref: "#/components/schemas/PlaylistDto"
        sermons:
          type: array
          items:
            $ref: "#/components/schemas/TrackDto"
        trendingNow:
          type: array
          items:
            $ref: "#/components/schemas/TrackDto"
    ItemsRequest:
      type: object
      properties:
        mediaItemIds:
          type: array
