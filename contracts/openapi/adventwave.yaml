components:
  schemas:
    AccountCreateRequest:
      type: object
      properties:
        displayName:
          type: string
          maxLength: 120
          minLength: 0
        email:
          type: string
          minLength: 1
        role:
          type: string
          minLength: 1
          pattern: super_admin|content_manager|rights_manager|viewer
        temporaryPassword:
          type: string
          minLength: 1
      required:
      - displayName
      - email
      - role
      - temporaryPassword
    AccountUpdateRequest:
      type: object
      properties:
        active:
          type: boolean
        displayName:
          type: string
          maxLength: 120
          minLength: 1
        role:
          type: string
          pattern: super_admin|content_manager|rights_manager|viewer
    AdminAccountDto:
      type: object
      properties:
        active:
          type: boolean
        createdAt:
          type: string
        displayName:
          type: string
        email:
          type: string
        id:
          type: string
        lastLoginAt:
          type: string
        lockedUntil:
          type: string
        mustChangePassword:
          type: boolean
        permissions:
          type: array
          items:
            type: string
        role:
          type: string
    AdminAlbumDto:
      type: object
      properties:
        artistId:
          type: string
        coverUrl:
          type: string
        createdAt:
          type: string
        id:
          type: string
        releaseDate:
          type: string
