openapi: 3.1.0
info:
  description: |
    The public REST surface for the AdventWave web and mobile clients.

    Every endpoint except `POST /v1/auth/session`, `POST /v1/auth/admin/login` and the signed playback redirect requires a bearer JWT. Until the managed IdP is chosen, listener tokens come from `POST /v1/auth/session`, which verifies no credential and is disabled by setting `spring.security.oauth2.resourceserver.jwt.issuer-uri`.

    The admin surface (`/v1/admin/**`) takes a token from `POST /v1/auth/admin/login` (email and password). Each operation needs one permission of the account's role — `catalog:read`, `media:write`, `media:publish`, `rights:write` or `admins:manage` — checked against the account as stored on every request; `catalog:write`, the scope before roles existed, is still accepted on catalogue operations.
  license:
    name: Proprietary
  title: AdventWave API
  version: 1.5.0
servers:
- description: This instance
  url: http://localhost:8080
security:
- bearerAuth: []
paths:
  /v1/admin/accounts:
    get:
      operationId: list_1
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminAccountDto"
          description: OK
        "401":
          description: "Missing, expired, or unverifiable bearer token. Empty body."
          headers:
            WWW-Authenticate:
              description: "`Bearer`, with error=\"invalid_token\" and a description\
                \ when a token was presented"
              schema:
                type: string
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "The account's role lacks the admins:manage permission, or\
            \ its password must be changed first; the message says which"
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unhandled failure; the body carries no detail
      security:
      - bearerAuth:
        - admins:manage
      tags:
      - "admin: accounts"
    post:
      operationId: create_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountCreateRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAccountDto"
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Validation failed, a parameter would not convert, or a referenced\
            \ item is unknown"
        "401":
          description: "Missing, expired, or unverifiable bearer token. Empty body."
          headers:
            WWW-Authenticate:
              description: "`Bearer`, with error=\"invalid_token\" and a description\
                \ when a token was presented"
              schema:
                type: string
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "The account's role lacks the admins:manage permission, or\
            \ its password must be changed first; the message says which"
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: The target's current state refuses this operation; the message
            says why
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unhandled failure; the body carries no detail
      security:
      - bearerAuth:
        - admins:manage
      tags:
