openapi: 3.1.0
info:
  description: |
    The public REST surface for the AdventWave web and mobile clients.

    Every endpoint except `POST /v1/auth/session` and the signed playback
    redirect requires a bearer JWT. Until the managed IdP is chosen, tokens come from `POST /v1/auth/session`, which verifies no credential and is disabled by setting `spring.security.oauth2.resourceserver.jwt.issuer-uri`.
  license:
    name: Proprietary
  title: AdventWave API
  version: 1.2.0
servers:
- description: This instance
  url: http://localhost:8080
security:
- bearerAuth: []
paths:
  /v1/admin/albums:
    post:
      operationId: createAlbum
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Request"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAlbumDto"
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Validation failed, a parameter would not convert, or a referenced\
            \ item is unknown"
        "401":
          description: "Missing, expired, or unverifiable bearer token. Empty body."
          headers:
            WWW-Authenticate:
              description: "`Bearer`, with error=\"invalid_token\" and a description\
                \ when a token was presented"
              schema:
                type: string
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: The token lacks the catalog:write scope
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: The target's current state refuses this operation; the message
            says why
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unhandled failure; the body carries no detail
      security:
      - bearerAuth:
        - catalog:write
      tags:
      - "admin: catalogue"
