      properties:
        liked:
          type: boolean
    PlaybackEvent:
      type: object
      properties:
        client_ts:
          type: string
        counted:
          type: boolean
        device:
          type: string
        duration_ms:
          type: integer
          format: int32
        event_id:
          type: string
        event_type:
          type: string
        media_item_id:
          type: string
        media_type:
          type: string
          enum:
          - song
          - sermon
          - podcast
        ms_played:
          type: integer
          format: int32
        private:
          type: boolean
        server_ts:
          type: string
        session_id:
          type: string
        user_id:
          type: string
    PlaybackSubmission:
      type: object
      properties:
        clientTs:
          type: string
        device:
          type: string
        eventId:
          type: string
          format: uuid
        eventType:
          type: string
          minLength: 1
        mediaItemId:
          type: string
          format: uuid
        msPlayed:
          type: integer
          format: int32
          minimum: 0
        sessionId:
          type: string
          format: uuid
      required:
      - eventType
      - mediaItemId
    PlayerStateDto:
      type: object
      properties:
        currentIndex:
          type: integer
          format: int32
          minimum: 0
        currentSongId:
          type: string
        orderedQueue:
          type: array
          items:
            type: string
        positionMs:
          type: integer
          format: int32
          minimum: 0
        queue:
          type: array
          items:
            type: string
        repeat:
          type: string
        shuffle:
          type: boolean
        tracks:
          type: array
          items:
            $ref: "#/components/schemas/TrackDto"
        updatedAt:
          type: string
        volume:
          type: number
          format: double
          maximum: 1.0
          minimum: 0.0
    PlaylistDto:
      type: object
      properties:
        cover:
          type: string
        description:
          type: string
        id:
          type: string
        isCurated:
          type: boolean
        legacyId:
